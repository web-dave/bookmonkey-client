<a routerLink="new">New</a> <br />
<app-book-filter [(filter)]="searchTerm" />{{ all() }}
<hr />
@let filteredList = books() | bookFilter: searchTerm;
@for (book of filteredList; track book.isbn) {
  @if ($first) {
    {{ $count }}/ {{ all() }}
    <hr />
  }
  <app-book-card [content]="book" (detailClicked)="goTo($event)" />
}
