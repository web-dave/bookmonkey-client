<input type="text" (input)="setSearchString($event)" />
<input type="text" #searchInput (input)="searchString = searchInput.value" />
@for (book of books | bookFilter: searchString; track book.title) {
  @if ($first) {
    <h1>Books</h1>
  }
  <app-book-card
    [content]="book"
    (detailClick)="navigate($event)"
  ></app-book-card>
}
