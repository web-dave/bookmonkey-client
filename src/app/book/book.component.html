<app-search [(searchString)]="searchString" />

@for (book of booksS() | bookFilter: searchString; track $index) {
  @if ($first) {
    <h5>{{ $count }}/{{ bookCount() }}</h5>
  }
  <app-book-card [content]="book" (detailClick)="navigate($event)">
    <h5>Book:{{ $index }}</h5></app-book-card
  >
}
