<h5>New Book</h5>

<form [formGroup]="newBookForm" (ngSubmit)="send()">
  <label for="isbn">ISBN:</label><br />
  <input type="text" name="isbn" formControlName="isbn" /><br />
  <input type="text" [formControlName]="'title'" /><br />
  <input type="text" formControlName="author" /><br />
  <input type="text" formControlName="subtitle" /><br />
  <input type="text" formControlName="abstract" /><br />
  <button type="submit">send</button>
</form>
