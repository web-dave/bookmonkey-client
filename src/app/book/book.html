<ng-content></ng-content>
<button (click)="show = !show">Show</button>
@if(show){
<input type="text" #searchInput (input)="setSearch(searchInput.value)" />
<h3>{{(books$ | async)?.length }}</h3>
@for (book of books$ | async | bookFilter: searchTerm; track book.isbn) {
<app-book-card [content]="book" (detailClick)="navigate($event)" />
} }
